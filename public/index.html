<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LifeCal Burgundy</title>
  <meta name="description" content="A year-progress wallpaper: one dot for every day of the year.">
  <style>
    :root {
      --bg: #594142;
      --rose: #E8C4CC;
      --gold: #D9AD68;
      --muted: rgba(232, 196, 204, 0.6);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--rose);
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    h1 { margin: 0; color: var(--gold); font-weight: 500; letter-spacing: 0.04em; font-size: 28px; }
    p { margin: 8px 0 0; color: var(--muted); line-height: 1.5; max-width: 32ch; }
    img {
      width: min(260px, 70vw);
      aspect-ratio: 1290 / 2796;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    a {
      color: var(--bg);
      background: var(--gold);
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 500;
    }
    a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <header>
    <h1>LifeCal</h1>
    <p>One dot for every day of the year. Set it as your wallpaper and watch the year fill in.</p>
  </header>
  <img src="/days" alt="Today's year-progress wallpaper">
  <a href="/days">Open wallpaper</a>
</body>
</html>
